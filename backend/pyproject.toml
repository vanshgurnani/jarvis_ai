[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-ai-backend"
version = "0.1.0"
description = "FRIDAY AI - Local macOS Desktop Companion Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.32",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.2",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.4"
]

[project.optional-dependencies]
voice = [
    "edge-tts>=6.1.12"
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.8.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

